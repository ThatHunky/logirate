[package]
name = "logirate"
version = "0.1.1"
edition = "2024"
description = "Per-game polling rate switcher for Logitech HID++ 2.0 mice (no G HUB needed)"
license = "MIT"

[dependencies]
anyhow = "1"
eframe = "0.37"
hidapi = { version = "2", default-features = false, features = ["windows-native"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[[bin]]
name = "logirate"
path = "src/main.rs"

[[bin]]
name = "logirated"
path = "src/daemon.rs"

[[bin]]
name = "logirate-gui"
path = "src/gui.rs"

[profile.release]
lto = true
strip = true
